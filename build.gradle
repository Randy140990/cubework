plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+1.21.11"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/lightlens.accesswidener")
	mods {
		"lightlens" {
			sourceSet sourceSets.main
		}
	}
}

// In-game tests: a real client records, takes photos and checks the files (./gradlew runClientGameTest).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "lightlens-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// As in Lightreel's tests: chunks load normally (the synchroniser held the world at "Preparing spawn area").
loom {
	runs {
		clientGameTest {
			property("fabric.client.gametest.disableNetworkSynchronizer", "true")
			property("java.awt.headless", "true")
		}
	}
}

// The jar: Lightlens-0.1.0-for-MC1.21.11.jar
remapJar {
	archiveFileName = "Lightlens-${project.mod_version}-for-MC${project.minecraft_version}.jar"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE.txt") {
		rename { "LICENSE_lightlens.txt" }
	}
}

// For the compile check: the full compile classpath (the game with Mojang names, Fabric API), to read signatures.
tasks.register('printClasspath') {
	doLast {
		file("classpath.txt").text = sourceSets.main.compileClasspath.asPath
	}
}
