// Made by tools/prep.py for one Minecraft version (see tools/versions.json).
plugins {
	id '@PLUGIN@' version "${loom_version}"
}

version = "${project.mod_version}+${project.mc_target}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
@MAPPINGS@	@MOD@ "net.fabricmc:fabric-loader:${project.loader_version}"
	@MOD@ "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
	mods {
		"cubework" {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = (project.java_release as int)
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_release)
	targetCompatibility = JavaVersion.toVersion(project.java_release)
}

jar {
	from("LICENSE") {
		rename { "${it}_cubework" }
	}
}

// For the compile check: the classpath the sources compile against, to look classes up in.
tasks.register("printClasspath") {
	doLast {
		file("classpath.txt").text = sourceSets.main.compileClasspath.asPath
	}
}
