name: Compile check

# Development aid: compiles a work-in-progress branch (check/...) and saves the compiler's output and the
# signatures of the classes in ci/check-classes.txt to the 'ci-check' branch. It never fails the run, and
# it doesn't publish anything or start the game.
on:
  push:
    branches: ["check/**"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        shell: bash
        run: |
          set +e +o pipefail
          chmod +x gradlew
          mkdir -p out
          ./gradlew compileJava --stacktrace > out/compile.txt 2>&1; echo "exit=$?" >> out/compile.txt
          tail -30 out/compile.txt
          # When it compiles, the jar too (for testing before there's a release).
          if grep -q "exit=0" out/compile.txt; then
            ./gradlew build -x test > out/build.txt 2>&1; echo "exit=$?" >> out/build.txt
            cp $(ls build/libs/*.jar | grep -v -- '-sources.jar') out/ 2>/dev/null || true
          fi
          ./gradlew printClasspath > /dev/null 2>&1
          CP=$(cat classpath.txt 2>/dev/null)
          echo "$CP" | tr ':' '\n' > out/classpath.txt
          # Entries whose names match ci/check-find.txt (one pattern a line), in the game and in Fabric API.
          if [ -s ci/check-find.txt ]; then
            while read -r pat; do
              [ -z "$pat" ] && continue
              for F in $(echo "$CP" | tr ':' '\n'); do
                unzip -l "$F" 2>/dev/null | grep -i -E "$pat" | awk '{print $4}' | sed "s|^|$(basename $F): |" >> out/found.txt || true
              done
            done < ci/check-find.txt
          fi
          # Signatures of the classes in ci/check-classes.txt ("c some.Class" adds the bytecode).
          if [ -s ci/check-classes.txt ]; then
            while read -r cls; do
              [ -z "$cls" ] && continue
              case "$cls" in
                "c "*) c="${cls#c }"; javap -c -p -cp "$CP" "$c" > "out/$c.c.txt" 2>&1 || true ;;
                *) javap -p -cp "$CP" "$cls" > "out/$cls.txt" 2>&1 || true ;;
              esac
            done < ci/check-classes.txt
          fi
          # Vanilla sources (Loom's decompiler, Mojang names) for the paths in ci/check-sources.txt (one a
          # line: a class path, or "grep PATTERN path" for the matching lines only), and data files.
          if [ -s ci/check-sources.txt ]; then
            ./gradlew genSources > out/gensources.txt 2>&1
            SJAR=$(find ~/.gradle .gradle -name "minecraft-merged*sources.jar" 2>/dev/null | head -n 1)
            echo "sources: $SJAR" >> out/gensources.txt
            mkdir -p out/src
            while read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                "grep "*) rest="${line#grep }"; pat="${rest%% *}"; f="${rest#* }"
                  unzip -p "$SJAR" "$f" 2>/dev/null | grep -n -E "$pat" > "out/src/$(basename $f).grep.txt" ;;
                "data "*) f="${line#data }"
                  for J in $(find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -i -E "minecraft|server|client" | grep -v sources); do
                    unzip -p "$J" "$f" > "out/src/$(basename $f)" 2>/dev/null && [ -s "out/src/$(basename $f)" ] && break
                  done ;;
                *) unzip -p "$SJAR" "$line" > "out/src/$(basename $line)" 2>/dev/null ;;
              esac
            done < ci/check-sources.txt
          fi
          # Vanilla client assets matching the patterns in ci/check-assets.txt (one a line, e.g.
          # "assets/minecraft/textures/block/"), zipped into out/assets.zip.
          if [ -s ci/check-assets.txt ]; then
            CJ=$(find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -i -E "minecraft-(client|merged)|client-.*\.jar|minecraft.*client" | grep -v sources | head -n 1)
            for J in $(find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -i minecraft | grep -v sources); do
              if unzip -l "$J" 2>/dev/null | grep -q "assets/minecraft/textures/block/stone.png"; then CJ="$J"; break; fi
            done
            echo "client: $CJ" > out/assets.txt
            mkdir -p /tmp/assets && cd /tmp/assets
            while read -r pat; do
              [ -z "$pat" ] && continue
              unzip -o -q "$CJ" "${pat}*" >> "$GITHUB_WORKSPACE/out/assets.txt" 2>&1 || true
            done < "$GITHUB_WORKSPACE/ci/check-assets.txt"
            zip -q -r "$GITHUB_WORKSPACE/out/assets.zip" . || true
            cd "$GITHUB_WORKSPACE"
          fi
          exit 0
      - name: Save
        continue-on-error: true
        shell: bash
        run: |
          BR=ci-check-lightlens
          
          git config user.name "lightlens-ci"
          git config user.email "lightlens-ci@users.noreply.github.com"
          cp -r out /tmp/out
          git checkout --orphan ci-check-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf out && cp -r /tmp/out out
          git add -f out
          git commit -m "Compile check for ${GITHUB_SHA}" > /dev/null
          git push -f origin HEAD:$BR

  # A real 1.21.11 client records, takes photos and checks the files. Runs when the commit message has [ingame].
  ingame:
    if: contains(github.event.head_commit.message, '[ingame]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mods: [vanilla, shaders]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: FFmpeg and a virtual screen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg xvfb mesa-utils libgl1-mesa-dri pulseaudio
          # A sound card that goes nowhere, so the game's sound system starts and its sound can be recorded.
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=ci || true
          pactl set-default-sink ci || true
      - name: The FFmpeg players get (BtbN, LGPL)
        if: matrix.mods == 'vanilla'
        shell: bash
        run: |
          mkdir -p /tmp/btbn && cd /tmp/btbn
          curl -sL -o f.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
          tar -xJf f.tar.xz
          F=$(find /tmp/btbn -name ffmpeg -type f | head -n 1)
          $F -hide_banner -version | head -1
          echo "LIGHTLENS_FFMPEG=$F" >> $GITHUB_ENV
      - name: Sodium, Iris and Tempered Light
        if: matrix.mods == 'shaders'
        shell: bash
        run: |
          RUN=ci-stage
          mkdir -p $RUN/mods $RUN/shaderpacks $RUN/config
          for p in sodium iris; do
            URL=$(curl -s "https://api.modrinth.com/v2/project/$p/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D" \
              | python3 -c "import json,sys; v=json.load(sys.stdin); f=[x for x in v[0]['files'] if x.get('primary')] or v[0]['files']; print(f[0]['url'])" || true)
            echo "$p -> $URL"
            if [ -n "$URL" ]; then curl -sL -o "$RUN/mods/$p.jar" "$URL"; fi
          done
          # The build server's software graphics only take core-profile shaders, which the Tempered Light zip here
          # (2.4.4) doesn't compile as; Complementary Reimagined does, so it stands in to show shaders get recorded.
          SURL=$(curl -s "https://api.modrinth.com/v2/project/complementary-reimagined/version" \
            | python3 -c "import json,sys; v=json.load(sys.stdin); f=[x for x in v[0]['files'] if x.get('primary')] or v[0]['files']; print(f[0]['url'])" || true)
          echo "shader -> $SURL"
          if [ -n "$SURL" ]; then curl -sL -o "$RUN/shaderpacks/Complementary.zip" "$SURL"; PACK=Complementary.zip; else cp ci/Tempered-Light-*.zip $RUN/shaderpacks/; PACK=$(ls ci/Tempered-Light-*.zip | head -n 1 | xargs basename); fi
          printf 'shaderPack=%s\nenableShaders=true\n' "$PACK" > $RUN/config/iris.properties
          ls -la $RUN/mods
      - name: Run the in-game test
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          chmod +x gradlew
          mkdir -p ci-test
          ./gradlew runClientGameTest --stacktrace 2>&1 | tee ci-test/gradle.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Save the results
        if: always()
        shell: bash
        run: |
          RUN=build/run/clientGameTest
          mkdir -p /tmp/out/screenshots /tmp/out/captures
          cp ci-test/gradle.txt /tmp/out/ 2>/dev/null || true
          cp $RUN/logs/latest.log /tmp/out/latest.log 2>/dev/null || true
          grep -h "lightlens-test\|Lightlens" $RUN/logs/latest.log > /tmp/out/summary.txt 2>/dev/null || true
          grep -h "lightlens-test" ci-test/gradle.txt >> /tmp/out/summary.txt 2>/dev/null || true
          cp $RUN/screenshots/*.png /tmp/out/screenshots/ 2>/dev/null || true
          ls -laR $RUN/test-captures > /tmp/out/files.txt 2>/dev/null || true
          ls -laR $RUN/lightlens >> /tmp/out/files.txt 2>/dev/null || true
          find $RUN/test-captures -type f \( -name "*.jpg" -o -name "*.png" \) -size -12M -exec cp {} /tmp/out/captures/ \; 2>/dev/null || true
          find $RUN/test-captures -type f -name "*.mp4" -size -40M -exec cp {} /tmp/out/captures/ \; 2>/dev/null || true
          cp $RUN/crash-reports/*.txt /tmp/out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/out/commit.txt
          git config user.name "lightlens-ci"
          git config user.email "lightlens-ci@users.noreply.github.com"
          git checkout --orphan ci-test-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf ci-test && mkdir ci-test && cp -r /tmp/out/. ci-test/
          git add -f ci-test
          git commit -m "In-game test (${{ matrix.mods }}) for ${GITHUB_SHA}" > /dev/null
          git push -f origin HEAD:ci-test-lightlens-${{ matrix.mods }}
