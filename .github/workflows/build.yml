name: Build

# Every push to main builds the mod and publishes (or refreshes) the release for the version in
# gradle.properties, with the jar named orbit-arena-<version>-mc1.21.11.jar.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository == 'Randy140990/orbit-arena'
    steps:
      - uses: actions/checkout@v5
      # Loom 1.18 needs Java 25 to run Gradle; the mod itself is compiled for Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        shell: bash
        run: chmod +x gradlew && ./gradlew build -x test --stacktrace
      - name: Pick the jar
        id: jar
        shell: bash
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          SRC=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n 1)
          mkdir -p dist && cp "$SRC" "dist/orbit-arena-$VER-mc1.21.11.jar"
          echo "path=dist/orbit-arena-$VER-mc1.21.11.jar" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.jar.outputs.version }}
          name: Orbit Arena ${{ steps.jar.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.jar.outputs.path }}
          body_path: RELEASE_NOTES.md
          prerelease: true
