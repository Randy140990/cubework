name: Build

# Every push to main builds Cubework for each Minecraft version in tools/versions.json and publishes
# (or refreshes) the release for the version in gradle.properties with every version's jar.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.t.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: t
        shell: bash
        # Versions marked "release": false in tools/versions.json are still being ported: compile-checked, not released.
        run: echo "list=$(python3 -c "import json; print(json.dumps([t['name'] for t in json.load(open('tools/versions.json')) if t.get('release', True)]))")" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v5
      # Loom needs Java 25 to run Gradle; the mod is compiled for each version's Java (21, or 25 from 26.1).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        shell: bash
        run: |
          chmod +x gradlew
          T="${{ matrix.target }}"
          mkdir -p ci-logs vanilla
          python3 tools/build/vanilla.py "$T" "vanilla/$T"
          python3 tools/prep.py "$T" --fabric-api "$(cat vanilla/$T/fabric-api.txt)" --blocks "vanilla/$T/blocks.txt" --continuity "$(cat vanilla/$T/continuity.txt 2>/dev/null)"
          ./gradlew -p "build/v/$T" build -x test --stacktrace 2>&1 | tee "ci-logs/build-$T.txt"; test ${PIPESTATUS[0]} -eq 0
          mkdir -p jars && cp $(ls build/v/$T/build/libs/*.jar | grep -v -- '-sources.jar') jars/
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: jars/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-${{ matrix.target }}
          path: ci-logs/

  release:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: /tmp/jars
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: /tmp/logs
          merge-multiple: true
      - name: Read mod version
        id: ver
        shell: bash
        run: |
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          ls -la /tmp/jars /tmp/logs 2>/dev/null || true
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cubework ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: /tmp/jars/*.jar
          body_path: RELEASE_NOTES.md
          prerelease: true
      # When a version fails to build, save the logs to a 'ci-logs' branch to read without the Actions page.
      - name: Save logs on failure
        if: needs.build.result != 'success'
        shell: bash
        run: |
          git config user.name "cubework-ci"
          git config user.email "cubework-ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf ci-logs && mkdir ci-logs && cp -r /tmp/logs/. ci-logs/ 2>/dev/null || true
          git add -f ci-logs
          git commit -m "CI logs for ${GITHUB_SHA}" > /dev/null
          git push -f origin HEAD:ci-logs
